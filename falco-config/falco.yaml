# Falco configuration with plugins
json_output: true
json_include_output_property: true
log_level: info
log_stderr: true
log_syslog: false

# Load plugins
plugins:
  - name: container
    library_path: libcontainer.so
    init_config: ""

# Load plugin rules
load_plugins: [container]

rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml

stdout_output:
  enabled: true

file_output:
  enabled: false
  
syslog_output:
  enabled: false

program_output:
  enabled: false
  keep_alive: false
  program: "cat"